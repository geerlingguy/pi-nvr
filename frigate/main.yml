---
- hosts: dvr
  become: true

  handlers:
    - name: Restart containers
      ansible.builtin.command:
        cmd: docker compose --ansi never --progress plain --file docker-compose.yml restart
        chdir: "~/frigate/"
      become: false
      register: temp_compose_up
      changed_when: true
      listen: 'restart containers'

  pre_tasks:
    - name: Include custom configuration.
      include_vars: "{{ item }}"
      with_fileglob:
        - "{{ playbook_dir }}/../config.yml"
      tags: ['always']

    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600

  tasks:
    - name: Ignore PEP 668 because it's silly.
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      with_items:
        - /usr/lib/python3.11/EXTERNALLY-MANAGED
        - /usr/lib/python3.13/EXTERNALLY-MANAGED

    - name: Ensure pip is installed.
      ansible.builtin.apt:
        name: python3-pip
        state: present

    - name: Install required python libraries.
      ansible.builtin.pip:
        name: docker
        state: present

    - name: Create Frigate folders on Pi.
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      become: false
      with_items:
        - "~/frigate"
        - "~/frigate/mosquitto"
        - "~/frigate/mosquitto/logs"
      register: create_folders

    - name: Copy Frigate files to Pi.
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "~/frigate/{{ item }}"
        mode: '0640'
      become: false
      notify: restart containers
      with_items:
        - docker-compose.yml
        - frigate.yml
        - mosquitto/mosquitto.conf
        - mosquitto/mqtt-auth.conf
        - mosquitto/mqtt-acl.conf

    # See: https://github.com/ansible-collections/community.docker/pull/586
    - name: Validate Docker Compose file.
      ansible.builtin.command:
        cmd: docker compose --file docker-compose.yml config --quiet
        chdir: "~/frigate/"
      become: false
      changed_when: false

    - name: Pull images to make sure they're up-to-date
      community.docker.docker_image:
        name: "{{ item }}"
        source: pull
      loop:
        - "{{ frigate_container_image }}"
        - "{{ mqtt_container_image }}"

    - name: Start containers
      ansible.builtin.command:
        cmd: docker compose --ansi never --progress plain --file docker-compose.yml up --detach
        chdir: "~/frigate/"
      become: false
      register: temp_compose_up
      changed_when: "'Started' in temp_compose_up.stdout"

    - name: Install mosquitto utils.
      ansible.builtin.package:
        name:
          - mosquitto
          - mosquitto-clients
        state: present
      when: frigate_configure_mqtt_broker

    - name: Ensure host-side mosquitto services are stopped.
      ansible.builtin.service:
        name: mosquitto
        state: stopped
        enabled: false
      when: frigate_configure_mqtt_broker

    # Must be done outside the container, since it won't start until done.
    - name: Encrypt the mosquitto passwords.
      ansible.builtin.command:
        cmd: mosquitto_passwd -U mqtt-auth.conf
        chdir: "~/frigate/mosquitto"
      become: false
      register: mosquitto_password_encrypt
      changed_when: false
      when: frigate_configure_mqtt_broker
      notify: restart containers
